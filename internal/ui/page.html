<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shed</title>
<meta name="shed-token" content="">
<style>
  :root {
    --bg: #0d0f13; --panel: #151820; --panel2: #1a1e27; --line: #252a35; --text: #d7dbe3; --dim: #8a93a6;
    --ok: #4cc38a; --warn: #e5b454; --bad: #ef6b6b; --accent: #7aa2f7; --violet: #b48ef7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  header { position: sticky; top: 0; z-index: 4; display: flex; gap: 12px; align-items: center; padding: 10px 20px; background: #101318; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 16px; letter-spacing: .5px; }
  header h1 span { color: var(--dim); font-weight: 400; }
  .pill { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); font-size: 12px; white-space: nowrap; }
  .pill.bad { color: #fff; background: var(--bad); border-color: var(--bad); }
  .pill.ok { color: var(--ok); border-color: #2a5a44; }
  .pill.warn { color: var(--warn); border-color: #6a5427; }
  .tabs { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .tabs button { border: 0; background: none; color: var(--dim); padding: 3px 12px; border-radius: 6px; }
  .tabs button.on { background: #262c3a; color: var(--text); }
  .spacer { flex: 1; }
  .meta { color: var(--dim); font-size: 12px; }
  main { padding: 16px 20px 40px; display: grid; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .panel > h2 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--dim); display: flex; gap: 8px; align-items: baseline; }
  .empty { color: var(--dim); padding: 4px 0; }
  a { color: var(--accent); text-decoration: none; }
  button { background: #222733; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12.5px; }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: inherit; font-size: 12.5px; }

  /* Goals */
  .goals { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .goal { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .goal .name { font-weight: 600; }
  .goal .repo { color: var(--dim); font-size: 12px; }
  .bar { height: 8px; background: #252a35; border-radius: 99px; overflow: hidden; margin: 8px 0 6px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #4cc38a, #7aa2f7); }
  .goal .nums { display: flex; justify-content: space-between; font-size: 12.5px; }
  .goal .eta { font-size: 18px; font-weight: 600; margin-top: 4px; }
  .goal .eta.no { color: var(--warn); font-size: 13px; font-weight: 500; }
  .goal .eta.no.dim { color: var(--dim); }
  .goal .next { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .goal .crew { color: var(--violet); font-size: 12px; margin-top: 4px; }
  .chip.crew { color: var(--violet); border-color: #4a3a6e; }
  .goal { cursor: context-menu; }
  .goal.focus { border-color: #3d5a9e; box-shadow: inset 3px 0 0 var(--accent); }
  .goal.tabled { opacity: .55; }
  .goal .mode { float: right; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
  .goal.focus .mode { color: var(--accent); }
  .goal.tabled .mode { color: var(--dim); }
  svg.hill:empty { display: none; }
  svg.hill { width: 100%; height: 210px; display: block; margin-bottom: 12px; }
  svg.hill text { fill: var(--text); font-size: 11px; }
  svg.hill text.axis { fill: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; }
  svg.hill circle { cursor: context-menu; }

  .grid3 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.2fr); }
  @media (max-width: 1200px) { .grid3 { grid-template-columns: 1fr; } }

  /* Fleet */
  .machine { margin-bottom: 12px; }
  .machine .head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; }
  .machine .head strong { font-size: 14px; }
  .workers { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .worker { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 6px; padding: 6px 8px; cursor: pointer; }
  .worker:hover { background: #20252f; }
  .worker .top { display: flex; justify-content: space-between; gap: 6px; }
  .worker .what { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .worker.s-working { border-left-color: var(--ok); }
  .worker.s-waiting { border-left-color: var(--warn); }
  .worker.v-stuck, .worker.v-needs_owner, .worker.v-error { border-left-color: var(--bad); }
  .worker.v-limited { border-left-color: var(--violet); }
  .unreachable { color: var(--bad); font-size: 12.5px; }
  .chip { display: inline-block; padding: 0 6px; margin: 0 4px 4px 0; border-radius: 4px; font-size: 11.5px; border: 1px solid var(--line); color: var(--dim); }
  .chip.fail { color: var(--bad); border-color: #5a2a2d; }
  .chip.goal { color: var(--accent); border-color: #2c3b60; }
  .v-on_track, .v-done, .v-started { color: var(--ok); }
  .v-nudge, .v-held, .v-unsent { color: var(--warn); }
  .v-limited { color: var(--violet); }
  .v-stuck, .v-needs_owner, .v-error { color: var(--bad); }

  /* Peers */
  svg.peers { width: 100%; height: 320px; display: block; }
  svg.peers text { fill: var(--text); font-size: 11px; }
  svg.peers text.m { fill: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .6px; }

  /* Needs you */
  details.group { border-top: 1px solid var(--line); padding: 6px 0; }
  details.group:first-of-type { border-top: 0; }
  details.group summary { cursor: pointer; display: flex; gap: 8px; align-items: baseline; list-style: none; }
  details.group summary::before { content: "▸"; color: var(--dim); }
  details.group[open] summary::before { content: "▾"; }
  details.group summary .n { margin-left: auto; font-weight: 600; }
  details.group ul { margin: 6px 0 0; padding-left: 18px; }
  details.group li { margin: 3px 0; font-size: 12.5px; }
  details.group li .where { color: var(--dim); }

  /* Flow */
  .flow { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
  .stat div { background: var(--panel2); border-radius: 6px; padding: 6px 8px; }
  .stat b { display: block; font-size: 17px; }
  .stat span { color: var(--dim); font-size: 11px; }
  .good { color: var(--ok); } .badn { color: var(--bad); }

  /* Board */
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 8px; }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; max-height: calc(100vh - 150px); min-width: 0; }
  .col > h3 { margin: 0; padding: 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--dim); display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
  .col .cards { overflow-y: auto; padding: 8px; display: grid; gap: 6px; align-content: start; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; cursor: context-menu; min-width: 0; overflow-wrap: anywhere; }
  .card .repo-tag { color: var(--dim); font-size: 11px; }
  .card:hover { border-color: #3a4152; }
  .card .t { font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 2px 0 4px; }
  .card .note { font-size: 11.5px; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .row { display: flex; justify-content: space-between; gap: 6px; font-size: 11.5px; color: var(--dim); }

  /* Menu and drawer */
  .menu { position: fixed; z-index: 6; background: #1b1f28; border: 1px solid #343b4a; border-radius: 8px; padding: 4px; min-width: 260px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .menu .item { padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 12.5px; }
  .menu .item:hover { background: #283042; }
  .menu .item code { color: var(--dim); display: block; font-size: 11px; }
  .menu .sep { height: 1px; background: var(--line); margin: 4px 0; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #263043; padding: 6px 14px; border-radius: 8px; z-index: 7; font-size: 12.5px; }
  aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(900px, 100%); background: #0b0d11; border-left: 1px solid var(--line); display: none; flex-direction: column; z-index: 5; }
  aside.open { display: flex; }
  aside .bar2 { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  aside pre { flex: 1; margin: 0; padding: 12px 14px; overflow: auto; white-space: pre-wrap; }
  aside .log { max-height: 35%; overflow: auto; border-top: 1px solid var(--line); padding: 8px 14px; font-size: 12px; }
  [hidden] { display: none !important; }
  .answers li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .answers .q { color: var(--dim); font-size: 12px; white-space: pre-wrap; flex-basis: 100%; margin: 2px 0 0 0; max-height: 4.5em; overflow: hidden; }
  button.act { background: #1f3326; border-color: #2a5a44; color: var(--ok); padding: 2px 8px; }
  button.act:hover { background: #26402f; }
  .confirm { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 8; display: flex; align-items: center; justify-content: center; }
  .confirm .box { background: #151820; border: 1px solid #343b4a; border-radius: 10px; padding: 16px 18px; width: min(620px, 92vw); }
  .confirm h3 { margin: 0 0 8px; font-size: 15px; }
  .confirm pre { background: #0d0f13; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
  .confirm .row2 { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .confirm button.post { background: #2a5a44; border-color: #2a5a44; color: #fff; }
  .confirm button.post.risky { background: #6a3a2a; border-color: #8a4a35; }
  .confirm .warn { background: #2a1d14; border: 1px solid #6a4a27; color: var(--warn); border-radius: 6px; padding: 8px 10px; margin: 8px 0; font-size: 12.5px; }
  .confirm .does { margin: 8px 0; }
</style>
</head>
<body>
<header>
  <h1>shed <span>observe</span></h1>
  <span id="needs" class="pill">…</span>
  <span id="counts" class="meta"></span>
  <div class="tabs"><button id="tab-deck" class="on">Deck</button><button id="tab-board">Board</button></div>
  <span class="spacer"></span>
  <span id="when" class="meta"></span>
  <span id="conn" class="pill">connecting</span>
</header>
<main id="deck">
  <section class="panel"><h2>Goals <span id="goals-note" class="meta"></span></h2><svg id="hill" class="hill" viewBox="0 0 900 210" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Hill chart of the goals"></svg><div id="goals" class="goals"><div class="empty">Reading the fleet…</div></div></section>
  <div class="grid3">
    <section class="panel"><h2>Fleet</h2><div id="fleet"><div class="empty">Reading the fleet…</div></div></section>
    <section class="panel"><h2>Peers <span class="meta">messages in the last day</span></h2><div id="peers"></div></section>
    <section class="panel"><h2>Needs you <span id="needs-note" class="meta"></span></h2><div id="attn"></div></section>
  </div>
  <section class="panel"><h2>Flow <span class="meta">last 24 hours</span></h2><div id="flow" class="flow"></div></section>
</main>
<main id="boardview" hidden>
  <div class="filters">
    <select id="f-goal"></select><select id="f-repo"></select><select id="f-machine"></select>
    <span class="meta">Right-click a card to bump it, bump what it waits for, or answer it.</span>
  </div>
  <div id="board" class="board"></div>
</main>
<aside id="drawer">
  <div class="bar2"><strong id="drawer-title"></strong><span id="drawer-note" class="meta"></span><span class="spacer"></span><button id="drawer-close">Close</button></div>
  <pre id="screen"></pre>
  <div class="log" id="log"></div>
</aside>
<script>
"use strict";
// Every value from the fleet is set as text, never as markup: issue titles
// and screens are written by others.
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k === "onclick") e.addEventListener("click", v);
    else if (k === "oncontextmenu") e.addEventListener("contextmenu", v);
    else if (k === "href") e.href = /^https:\/\//.test(v) ? v : "#";
    else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k instanceof Node ? k : String(k));
  return e;
}
function svg(tag, attrs, ...kids) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) typeof v === "function" ? e.addEventListener(k.replace(/^on/, ""), v) : e.setAttribute(k, v);
  for (const k of kids) if (k != null) e.append(k instanceof Node ? k : String(k));
  return e;
}
function ago(t, now) {
  const s = Math.max(0, (now - new Date(t)) / 1000);
  if (s < 90) return Math.round(s) + "s";
  if (s < 5400) return Math.round(s / 60) + "m";
  if (s < 172800) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
}
function short(repo) { return repo.split("/").pop(); }

const token = (document.querySelector('meta[name="shed-token"]') || {}).content || "";
let last = null;
let view = "deck";
const opened = new Set(); // needs-you groups the owner opened
const firstLoad = Date.now();

function render(snap) {
  last = snap;
  const now = new Date();
  const needs = document.getElementById("needs");
  needs.textContent = snap.needs_you ? snap.needs_you + " need you" : "on track";
  needs.className = "pill " + (snap.needs_you ? "bad" : "ok");
  document.getElementById("when").textContent = "read " + ago(snap.at, now) + " ago, took " + snap.took + ", every " + snap.every;
  const workers = (snap.report.machines || []).flatMap(m => m.workers || []);
  const c = { working: 0, idle: 0, limited: 0, stuck: 0 };
  for (const w of workers) {
    const v = (w.last || {}).verdict;
    if (v === "limited") c.limited++;
    else if (v === "stuck" || v === "needs_owner") c.stuck++;
    else if (w.state === "working") c.working++;
    else c.idle++;
  }
  document.getElementById("counts").textContent = c.working + " working · " + c.idle + " idle · " + c.limited + " limited" + (c.stuck ? " · " + c.stuck + " stuck" : "");
  if (view === "deck") renderDeck(snap, now); else renderBoard(snap, now);
}

function renderDeck(snap, now) {
  renderGoals(snap);
  document.getElementById("fleet").replaceChildren(...(snap.report.machines || []).map(m => machine(m, now)));
  renderPeers(snap);
  renderAttention(snap);
  renderFlow(snap);
}

// crewsOf reads, from the report's issues, each goal's crew: the sessions
// that signed its plans, and its crew reviews by state.
function crewsOf(snap) {
  const crews = new Map();
  const seen = new Set();
  for (const m of snap.report.machines || []) for (const i of m.issues || []) {
    const key = i.repo + "#" + i.number;
    if (!i.goal || seen.has(key)) continue;
    seen.add(key);
    const c = crews.get(i.goal) || { sessions: new Set(), due: 0, changes: 0 };
    if (i.session) c.sessions.add(i.session);
    if (i.crew === "due") c.due++;
    if (i.crew === "changes") c.changes++;
    crews.set(i.goal, c);
  }
  return crews;
}

function renderGoals(snap) {
  const box = document.getElementById("goals");
  const note = document.getElementById("goals-note");
  if (!snap.deck) {
    note.textContent = "";
    box.replaceChildren(el("div", { class: "empty" }, "Reading goals, flow and spend…"));
    document.getElementById("hill").replaceChildren();
    return;
  }
  note.textContent = "read " + ago(snap.deck.now, new Date()) + " ago";
  const goals = snap.deck.goals || [];
  if (!goals.length) {
    document.getElementById("hill").replaceChildren();
    box.replaceChildren(el("div", { class: "empty" }, "No goals. Label issues with a goal (supervisor: goal_labels: \"goal:\") to see each goal's progress and when it will be done."));
    return;
  }
  // A goal can span repositories: one card per label, its repositories
  // summed, so a goal reads as one outcome.
  const byLabel = new Map();
  for (const g of goals) {
    const p = g.pace || {};
    const t = byLabel.get(g.label) || { label: g.label, repos: [], closed: 0, total: 0, open: 0, opened: 0, closedWeek: 0, next: [], error: "" };
    t.repos.push(g.repo); t.closed += g.closed; t.total += g.total;
    t.open += p.open || 0; t.opened += p.opened_week || 0; t.closedWeek += p.closed_week || 0;
    if (g.next) t.next.push((goals.filter(o => o.label === g.label).length > 1 ? short(g.repo) + ": " : "") + g.next);
    if (g.error) t.error = g.error;
    byLabel.set(g.label, t);
  }
  const now = Date.now();
  const crews = crewsOf(snap);
  const modes = goalModes(snap);
  const modeRank = l => modes.get(l) === "focus" ? 0 : modes.get(l) === "tabled" ? 2 : 1;
  const cards = [...byLabel.values()].map(t => {
    t.perDay = (t.closedWeek - t.opened) / 7;
    t.eta = t.open > 0 && t.perDay > 0 ? new Date(now + t.open / t.perDay * 86400000) : null;
    t.rank = t.error ? 4 : !t.open ? 3 : t.eta ? 0 : t.opened || t.closedWeek ? 1 : 2;
    return t;
  }).sort((a, b) => modeRank(a.label) - modeRank(b.label) || a.rank - b.rank || (a.eta && b.eta ? a.eta - b.eta : 0) || b.open - a.open);
  box.replaceChildren(...cards.map(t => {
    const pct = t.total ? Math.round(100 * t.closed / t.total) : 0;
    let eta;
    if (t.error) eta = el("div", { class: "eta no" }, "cannot be counted");
    else if (!t.open) eta = el("div", { class: "eta good" }, "done");
    else if (t.eta) eta = el("div", { class: "eta" }, "ETA " + t.eta.toLocaleDateString(undefined, { month: "short", day: "numeric" }),
      el("span", { class: "meta" }, "  " + t.perDay.toFixed(1) + " net a day"));
    else if (!t.opened && !t.closedWeek) eta = el("div", { class: "eta no dim" }, "stalled: nothing opened or closed in 7 days");
    else eta = el("div", { class: "eta no" }, "not converging: " + t.opened + " opened, " + t.closedWeek + " closed in 7 days");
    const mode = modes.get(t.label) || "";
    return el("div", { class: "goal" + (mode ? " " + mode : ""), title: "Right-click to focus on this goal or table it", oncontextmenu: e => { e.preventDefault(); goalMenu(e, t.label); } },
      mode ? el("span", { class: "mode" }, mode === "focus" ? "in focus" : "tabled") : null,
      el("div", { class: "name" }, goalName(t.label)),
      el("div", { class: "repo" }, t.repos.map(short).join(" + ")),
      el("div", { class: "bar" }, el("div", { style: "width:" + pct + "%" })),
      el("div", { class: "nums" }, el("span", {}, t.closed + " of " + t.total + " closed (" + pct + "%)"), el("span", { class: "meta" }, t.open + " open")),
      eta,
      crewLine(crews.get(t.label)),
      ...t.next.map(n => el("div", { class: "next" }, n)));
  }));
  renderHill(snap, cards, modes);
}

function goalName(label) { return label.replace(/^[^:]*:\s*/, ""); }

// goalModes reads, from the machines, each goal the owner focused on or
// tabled.
function goalModes(snap) {
  const modes = new Map();
  for (const m of snap.report.machines || []) for (const [label, mode] of Object.entries((m.probe && m.probe.goals) || {})) modes.set(label, mode);
  return modes;
}

// Where an open issue stands on the hill: uphill while it is still being
// worked out (queued, held, waiting on you), over the top once a worker
// builds it, downhill as its pull request is checked, merged and looked at.
const hillAt = { queued: 10, held: 15, waiting: 28, working: 45, draft: 55, rework: 58, verifying: 72, "eye check": 85, merged: 92 };

// renderHill draws each goal on one hill: its place is the mean of its
// issues' places, a closed issue at the bottom of the far side and an open
// one no queue has started at the foot of the near side. A dot's size is
// the goal's open issues.
function renderHill(snap, goals, modes) {
  const box = document.getElementById("hill");
  const seen = new Map();
  for (const m of snap.report.machines || []) for (const i of m.issues || []) {
    if (!i.goal) continue;
    const key = i.repo + "#" + i.number;
    if (!seen.has(key) || hillAt[i.state] > hillAt[seen.get(key).state]) seen.set(key, i);
  }
  const W = 900, base = 170, top = 40, left = 30, right = W - 30;
  const X = x => left + (right - left) * x / 100;
  const Y = x => base - (base - top) * (1 - Math.cos(2 * Math.PI * x / 100)) / 2;
  let path = "";
  for (let x = 0; x <= 100; x += 1) path += (x ? "L" : "M") + X(x).toFixed(1) + " " + Y(x).toFixed(1);
  const kids = [
    svg("path", { d: path, fill: "none", stroke: "#3a4150", "stroke-width": 2 }),
    svg("line", { x1: X(50), y1: top - 12, x2: X(50), y2: base + 8, stroke: "#2a303c", "stroke-dasharray": "3 4" }),
    svg("text", { x: X(25), y: base + 28, "text-anchor": "middle", class: "axis" }, "working it out"),
    svg("text", { x: X(75), y: base + 28, "text-anchor": "middle", class: "axis" }, "making it happen"),
  ];
  const dots = goals.filter(t => !t.error && t.total > 0).map(t => {
    const open = [...seen.values()].filter(i => i.goal === t.label);
    const unseen = Math.max(0, t.open - open.length);
    const sum = t.closed * 100 + unseen * 5 + open.reduce((n, i) => n + (hillAt[i.state] ?? 10), 0);
    const count = t.closed + unseen + open.length;
    return { t, x: count ? sum / count : 0, mode: modes.get(t.label) || "" };
  }).sort((a, b) => a.x - b.x);
  // Labels take the first row where they fit beside the one before.
  const rows = [-16, -30, 26, -44, 40];
  const ends = rows.map(() => -Infinity);
  for (const d of dots) {
    const cx = X(d.x), cy = Y(d.x), name = goalName(d.t.label);
    const r = 5 + Math.min(9, Math.sqrt(d.t.open));
    const color = d.mode === "focus" ? "#7aa2f7" : d.mode === "tabled" ? "#596070" : !d.t.open ? "#4cc38a" : d.t.eta ? "#4cc38a" : "#e0af68";
    const w = name.length * 6.4 + 10;
    let row = rows.findIndex((_, n) => ends[n] < cx - w / 2);
    if (row < 0) row = ends.indexOf(Math.min(...ends));
    ends[row] = cx + w / 2;
    const tip = name + ": " + d.t.closed + " of " + d.t.total + " closed, " + d.t.open + " open" + (d.mode ? " · " + (d.mode === "focus" ? "in focus" : "tabled") : "") + ". Right-click to focus or table it.";
    kids.push(svg("g", { oncontextmenu: e => { e.preventDefault(); goalMenu(e, d.t.label); } },
      svg("line", { x1: cx, y1: cy, x2: cx, y2: cy + rows[row] + (rows[row] < 0 ? 4 : -10), stroke: "#2f3542" }),
      svg("circle", { cx, cy, r, fill: color, stroke: d.mode === "focus" ? "#c0d0ff" : "#14171d", "stroke-width": d.mode === "focus" ? 2 : 1.5, opacity: d.mode === "tabled" ? .6 : 1 }),
      svg("text", { x: cx, y: cy + rows[row], "text-anchor": "middle", "font-weight": d.mode === "focus" ? 600 : 400 }, name),
      svg("title", {}, tip)));
  }
  box.replaceChildren(...(dots.length ? kids : []));
}

// goalMenu offers what the owner can do with a goal: focus on it, table it,

// The peer graph: each session a node around a circle, grouped by machine;
// a line for each pair of peers, as thick as the messages between them in
// the last day, lit when one went in the last hour, dashed when none did.
function renderPeers(snap) {
  const nodes = new Map(), pairs = new Map();
  for (const m of snap.report.machines || []) for (const w of m.workers || []) {
    if (!w.peers || !w.peers.length) continue;
    const me = m.name + "-" + w.name;
    nodes.set(me, { id: me, machine: m.name, name: w.name });
    for (const p of w.peers) {
      if (!nodes.has(p.session)) nodes.set(p.session, { id: p.session, machine: p.machine, name: p.worker });
      const key = [me, p.session].sort().join("|");
      const e = pairs.get(key) || { a: me, b: p.session, day: 0, hour: 0 };
      e.day += p.day; e.hour += p.hour;
      pairs.set(key, e);
    }
  }
  // Two sessions that signed plans on the same goal are a crew on it.
  const goalsOf = new Map();
  for (const m of snap.report.machines || []) for (const i of m.issues || [])
    if (i.session && i.goal) goalsOf.set(i.session, (goalsOf.get(i.session) || new Set()).add(i.goal));
  const shared = (a, b) => [...(goalsOf.get(a) || [])].filter(g => (goalsOf.get(b) || new Set()).has(g));
  const box = document.getElementById("peers");
  if (!nodes.size) { box.replaceChildren(el("div", { class: "empty" }, "No worker has peers. Give workers peers: in the fleet file to let them message each other.")); return; }
  const list = [...nodes.values()].sort((x, y) => (x.machine + x.name).localeCompare(y.machine + y.name));
  const W = 460, H = 320, R = Math.min(W, H) / 2 - 50, cx = W / 2, cy = H / 2;
  list.forEach((n, i) => { const a = -Math.PI / 2 + 2 * Math.PI * i / list.length; n.x = cx + R * Math.cos(a); n.y = cy + R * Math.sin(a); n.a = a; });
  const g = svg("svg", { class: "peers", viewBox: "0 0 " + W + " " + H });
  let talk = 0;
  let quietCrews = 0;
  for (const e of pairs.values()) {
    const a = nodes.get(e.a), b = nodes.get(e.b);
    const goals = shared(e.a, e.b);
    talk += e.day;
    if (goals.length && !e.day) quietCrews++;
    g.append(svg("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: e.hour ? "#7aa2f7" : goals.length ? "#b48ef7" : e.day ? "#4a5a7e" : "#333a48",
      "stroke-width": e.day ? Math.min(8, 1.5 + Math.log2(1 + e.day)) : goals.length ? 1.5 : 1, "stroke-dasharray": e.day ? "" : "4 4" },
      svg("title", {}, e.a + " ↔ " + e.b + ": " + e.day + " in the last day, " + e.hour + " in the last hour" + (goals.length ? "; crew on " + goals.join(", ") : ""))));
  }
  const colors = ["#4cc38a", "#e5b454", "#b48ef7", "#7aa2f7", "#ef6b6b"];
  const machines = [...new Set(list.map(n => n.machine))];
  for (const n of list) {
    const col = colors[machines.indexOf(n.machine) % colors.length];
    const right = Math.cos(n.a) >= 0;
    g.append(svg("circle", { cx: n.x, cy: n.y, r: 7, fill: col }));
    g.append(svg("text", { x: n.x + (right ? 11 : -11), y: n.y + 4, "text-anchor": right ? "start" : "end" }, n.name));
    g.append(svg("text", { class: "m", x: n.x + (right ? 11 : -11), y: n.y + 16, "text-anchor": right ? "start" : "end" }, n.machine));
  }
  box.replaceChildren(g, el("div", { class: "meta" }, talk ? talk + " message(s) between peers in the last day" : "Peers have sent each other nothing in the last day."),
    quietCrews ? el("div", { class: "meta", style: "color:var(--violet)" }, quietCrews + " crew pair(s) build the same goal and have not talked (violet)") : null);
}

// confirmAction shows what an answer posts, and to what, before it does.
function confirmAction(a) {
  const close = () => c.remove();
  const doLabel = a.comment ? "Post on GitHub" : a.label;
  const post = el("button", { class: "post" + (a.warn ? " risky" : "") }, doLabel);
  // An action that needs a name (a goal's new label) starts from the old one.
  const name = a.ask ? el("input", { type: "text", value: a.goal || "", style: "display:block;width:100%;margin:6px 0" }) : null;
  const c = el("div", { class: "confirm", onclick: e => { if (e.target === c) close(); } },
    el("div", { class: "box" },
      el("h3", {}, a.label + " · " + (a.goal ? goalName(a.goal) : short(a.repo) + "#" + a.number)),
      a.context ? el("div", {}, el("div", { class: "meta" }, a.for ? "Why it waits" : "What it answers"), el("pre", {}, a.context)) : null,
      a.warn ? el("div", { class: "warn" }, a.warn) : null,
      a.comment ? el("div", {}, el("div", { class: "meta" }, "Posts this comment as you"), el("pre", {}, a.comment)) : el("div", { class: "does" }, a.does || ""),
      a.ask ? el("label", { class: "meta" }, a.ask, name) : null,
      el("div", { class: "row2" }, el("button", { onclick: close }, "Cancel"), post)));
  post.addEventListener("click", async () => {
    post.disabled = true;
    post.textContent = "Posting…";
    try {
      const r = await fetch("/api/act", { method: "POST", headers: { "Content-Type": "application/json", "X-Shed-Token": token }, body: JSON.stringify({ id: a.id, name: name ? name.value : "" }) });
      const text = await r.text();
      if (!r.ok) throw new Error(text.trim());
      close();
      toast(a.comment ? "Posted on " + short(a.repo) + "#" + a.number + ": " + a.comment : a.label + ": done" + (a.goal ? ". The page shows it after its next read." : ""));
    } catch (e) {
      post.disabled = false;
      post.textContent = doLabel;
      toast("Not posted: " + e.message);
    }
  });
  document.body.append(c);
}
document.addEventListener("keydown", e => { if (e.key === "Escape") { const c = document.querySelector(".confirm"); if (c) c.remove(); } });

// linkify turns owner/repo#123 into a link to the issue, as text nodes.
function linkify(text) {
  const span = el("span", {});
  let at = 0;
  for (const m of text.matchAll(/([\w.-]+\/[\w.-]+)#(\d+)/g)) {
    span.append(text.slice(at, m.index), el("a", { href: "https://github.com/" + m[1] + "/issues/" + m[2], target: "_blank", rel: "noopener" }, short(m[1]) + "#" + m[2]));
    at = m.index + m[0].length;

  span.append(text.slice(at));

// The board: one column per state shed gives an issue, each issue once
// however many queues it is in.
const columns = [
  ["held", "Held"], ["queued", "Queued"], ["working", "Working"], ["rework", "Rework"],
  ["verifying", "In CI / verifying"], ["waiting", "Waiting on you"], ["draft", "Draft"],
  ["eye check", "Eye check (staging)"], ["merged", "Merged"],
];
const filters = { goal: "", repo: "", machine: "" };
let manyRepos = false;
function boardIssues(snap) {
  const byKey = new Map();
  // Where each issue stands in the queues, as the agents ordered them:
  // its best place in any worker's queue.
  const place = new Map();
  for (const m of snap.report.machines || []) for (const q of Object.values((m.probe && m.probe.queues) || {}))
    (q.items || []).forEach((it, n) => { const k = it.repo + "#" + it.number; place.set(k, Math.min(place.get(k) ?? n, n)); });
  for (const m of snap.report.machines || []) for (const i of m.issues || []) {
    const key = i.repo + "#" + i.number;
    const have = byKey.get(key);
    if (have) { have.machines.push(m.name); continue; }
    byKey.set(key, { ...i, machines: [m.name], place: place.get(key) ?? Infinity });
  }
  return [...byKey.values()];
}
function fillSelect(id, label, values, key) {
  const s = document.getElementById(id);

  s.value = values.includes(want) ? want : "";

}
function renderBoard(snap, now) {

  fillSelect("f-goal", "goal", [...new Set(all.map(i => i.goal).filter(Boolean))].sort(), "goal");
  fillSelect("f-repo", "repository", [...new Set(all.map(i => i.repo))].sort(), "repo");
  fillSelect("f-machine", "machine", (snap.report.machines || []).map(m => m.name), "machine");
  const shown = all.filter(i => (!filters.goal || i.goal === filters.goal) && (!filters.repo || i.repo === filters.repo) && (!filters.machine || i.machines.includes(filters.machine)));
  const known = new Set(columns.map(c => c[0]));
  const cols = columns.concat([...new Set(shown.map(i => i.state).filter(s => !known.has(s) && s !== "done"))].map(s => [s, s]));
  document.getElementById("board").replaceChildren(...cols.map(([state, title]) => {
    const cards = shown.filter(i => i.state === state).sort((a, b) => (a.place - b.place) || (b.bumped - a.bumped) || a.number - b.number);
    return el("div", { class: "col" }, el("h3", {}, el("span", {}, title), el("span", {}, cards.length)),

}

// The card menu offers the shed command for each thing the owner can do

function menu(e, i) {

// showMenu shows a menu at the pointer: each item does its act, or copies

  m.style.top = Math.min(e.clientY, innerHeight - m.offsetHeight - 8) + "px";
}
function closeMenu() { const m = document.getElementById("menu"); if (m) m.remove(); }
document.addEventListener("click", e => { if (!e.target.closest("#menu")) closeMenu(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied: " + text); }
  catch { toast(text); }
}
function toast(text) {
  const t = el("div", { class: "toast" }, text);
  document.body.append(t);
  setTimeout(() => t.remove(), 2500);
}

for (const [id, key] of [["f-goal", "goal"], ["f-repo", "repo"], ["f-machine", "machine"]])
  document.getElementById(id).addEventListener("change", e => { filters[key] = e.target.value; if (last) render(last); });
function show(v) {
  view = v;
  document.getElementById("deck").hidden = v !== "deck";
  document.getElementById("boardview").hidden = v !== "board";
  document.getElementById("tab-deck").className = v === "deck" ? "on" : "";
  document.getElementById("tab-board").className = v === "board" ? "on" : "";
  location.hash = v === "board" ? "board" : "";
  if (last) render(last);
}
document.getElementById("tab-deck").addEventListener("click", () => show("deck"));
document.getElementById("tab-board").addEventListener("click", () => show("board"));

// The drawer shows one worker's screen and its machine's latest check-ins
// while it is open, read again every few seconds.
let timer = null;
function openWorker(machine, worker) {
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawer-title").textContent = machine + " / " + worker;
  const q = "machine=" + encodeURIComponent(machine) + "&worker=" + encodeURIComponent(worker);
  const load = async () => {
    const note = document.getElementById("drawer-note");
    try {
      const [scr, log] = await Promise.all([fetch("/api/screen?" + q), fetch("/api/log?machine=" + encodeURIComponent(machine))]);
      document.getElementById("screen").textContent = await scr.text();
      if (log.ok) {
        const rows = (await log.json()).filter(c => c.worker === worker).slice(-15).reverse();
        document.getElementById("log").replaceChildren(el("h3", {}, "Check-ins"),
          ...rows.map(c => el("div", {}, el("span", { class: "meta" }, ago(c.time, new Date()) + " "),
            el("span", { class: "v-" + c.verdict }, c.verdict), " ", c.kind, " — ", el("span", { class: "meta" }, c.reason || ""))));
      }
      note.textContent = (scr.ok ? "live · " : "could not read the screen · ") + new Date().toLocaleTimeString();
    } catch (e) {
      note.textContent = "could not read: " + e;
    }
  };
  clearInterval(timer);
  load();
  timer = setInterval(load, 5000);
}
document.getElementById("drawer-close").addEventListener("click", () => {
  clearInterval(timer);
  document.getElementById("drawer").classList.remove("open");
});

function connect() {
  const conn = document.getElementById("conn");
  const es = new EventSource("/api/events");
  es.onopen = () => { conn.textContent = "live"; conn.className = "pill ok"; };
  es.onmessage = e => render(JSON.parse(e.data));
  es.onerror = () => { conn.textContent = "reconnecting"; conn.className = "pill warn"; };
}
// Before the first report, say how long the read has taken: the first read
// of a large fleet can take a minute or more. After, a report older than
// two rounds is said to be late.
setInterval(() => {
  const when = document.getElementById("when");
  if (!last) { when.textContent = "first read of the fleet, " + Math.round((Date.now() - firstLoad) / 1000) + "s so far"; return; }
  const every = parseFloat(last.every) * (/h/.test(last.every) ? 3600 : /m/.test(last.every) && !/ms/.test(last.every) ? 60 : 1);
  const late = (new Date() - new Date(last.at)) / 1000 > 2 * every + 60;
  when.style.color = late ? "var(--warn)" : "";
  when.textContent = "read " + ago(last.at, new Date()) + " ago, took " + last.took + ", every " + last.every + (last.held ? " · " + last.held : "");
  if (last.held) when.style.color = "var(--warn)";
}, 1000);
if (location.hash === "#board") show("board");
connect();
</script>
</body>
