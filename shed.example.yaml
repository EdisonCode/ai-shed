# Copy to ~/.config/shed/shed.yaml (or ./shed.yaml) and edit.

defaults:
  # Checks that every machine must pass. A check passes when it exits 0.
  checks:
    - name: gh auth
      run: gh auth status
    - name: git identity
      run: git config --global user.email
    - name: claude
      run: command -v claude
    - name: tmux
      run: command -v tmux
  # Optional. Rules for every worker on every machine. They go into each
  # worker's brief, and the supervisor judges scope against them.
  standing_orders: |
    Open a pull request for every change. Never merge it yourself.
    Never deploy. Never weaken a test to make it pass.
    Never push with --no-verify.

  # Optional. Runs on this machine after `shed deploy` copies to each worker
  # machine, with SHED_MACHINE and SHED_HOST set. Use it to send what your
  # agent tool needs and shed does not know about.
  deploy_hook: rsync -a ~/.claude/agents ~/.claude/skills "$SHED_HOST:.claude/"

  # Optional. Runs on a worker machine when a worker starts to need you or a
  # task starts to fail. The message is in SHED_MESSAGE.
  # notify: curl -s -d "$SHED_MESSAGE" https://ntfy.sh/my-private-topic

machines:
  - name: linux-box
    host: me@linux-box            # any ssh target; "local" means this machine
    # Prepended to every check and task. Non-interactive shells get a short PATH.
    init: export PATH="$HOME/.local/bin:$PATH"
    checks:
      - name: docker
        run: docker info
    issues:
      # Open issues with this label are this machine's backlog.
      - repo: my-org/my-app
        label: "machine:linux-box"
        # Optional. Issues with these labels go first, in this order; then
        # the oldest first.
        priority: ["urgent", "quick"]
    # Optional. When the machine is busy with other work, no worker is handed
    # a new issue; work in progress goes on. A hand-over waits max_wait at
    # most, then goes through anyway.
    capacity:
      max_load: 1.5        # 1-minute load average per core
      # Exit 0 means busy. Here: two or more CI jobs are running.
      busy_when: '[ "$(pgrep -c -x "Runner\.Worker")" -ge 2 ]'
      max_wait: 20m
    workers:
      # A long-running agent session that the machine's agent starts, keeps
      # alive and checks in on. It runs in tmux window shed:app.
      - name: app
        dir: ~/Projects/my-app
        command: claude --permission-mode auto
        # Optional. Clear the worker's context at each new issue. Good for a
        # queue of independent issues; leave off for themed work.
        fresh_per_issue: true
        # Optional. The worker has a browser and does the eye checks of
        # merged work on staging. Needs a `repos` entry for its queue's
        # repositories; see below.
        # eye_checks: true
        # Optional. A queue of this worker's own, in place of the machine's.
        # Use it when one machine runs two workers.
        # issues:
        #   - repo: my-org/my-app
        #     label: "area:export"
        brief: |
          Work the issues in your queue. Stay inside the audit log and export
          features. Do not change the billing module.
    tasks:
      - name: nightly-deps
        schedule: "0 3 * * *"
        run: cd ~/Projects/my-app && ./scripts/update-deps.sh
        timeout: 30m

  - name: mac-mini
    host: me@mac-mini
    init: export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"
    issues:
      - repo: my-org/my-app
        label: "machine:mac-mini"
    tasks:
      - name: prune-worktrees
        schedule: "@every 6h"
        run: cd ~/work/my-app && git worktree prune

# Optional. What shed knows about a repository's deploys. With it, a worker
# with `eye_checks: true` looks at merged work on staging before it goes to
# production, and `shed status` shows what is merged, not yet in production
# and not yet looked at.
# repos:
#   - repo: my-org/my-app
#     staging:
#       url: https://staging.example.com
#       # Any command that prints the commit staging serves.
#       commit: "curl -fsS https://staging.example.com/healthz | jq -r .commit"
#       # What a worker may do on staging during an eye check. An act that
#       # is not named here is not allowed.
#       orders: |
#         You may sign in as the test user, open any page and save a draft.
#         Never place an order, send a message or change another user's data.
#       # Optional. The browser size to look at when a hand-back names none.
#       # The worker's comment always says the size it really had.
#       viewport: 1440x900
#     # Optional. Merged work is looked for since this commit.
#     production:
#       commit: "curl -fsS https://app.example.com/healthz | jq -r .commit"
#     # Optional. How far back to look when production is older than this
#     # or has no command. The default is 14 days.
#     look_back: 336h

# Optional. How the agent supervises workers. These are the defaults, except
# `models`, which is off unless you set it.
supervisor:
  # The reviewer: any command that reads a prompt on stdin and prints an answer.
  command: claude -p --model sonnet
  # How long a worker's prompt cache stays warm on your plan. shed cannot see
  # the cache; a worker that has been silent longer than this is "cold".
  cache_ttl: 5m
  # How often a busy worker is checked against its brief.
  scope_every: 30m
  # A nudge to a cold worker clears its context first ("clear"), or keeps it
  # and pays to read it again ("resume").
  when_cold: clear
  # What to type into a worker to empty its context and to switch its model.
  clear_command: /clear
  model_command: "/model {model}"
  # The model for an issue, from its labels. "switch" (the default) switches
  # the worker's own session. "tell" leaves the session alone and tells the
  # worker the model, for a worker that orchestrates sub-agents.
  models:
    default: sonnet
    labels:
      "model:opus": opus
    apply: switch

# Optional. These are the defaults: phrases in issue comments that mean the
# issue waits on you. A signal opens when a comment has the `ask` phrase and
# the text after it does not start with one of `clear`. It closes when a later
# comment has the `answered_by` phrase. With `follows_pr`, the ask names a
# pull request ("#41") and the signal closes when that pull request is merged
# or closed. With `sends_back`, your answer is something a worker must act
# on: an answer that comes after the worker handed back sends the issue back
# to a worker while its pull request is open. An answer that starts with one
# of `accept` right after the phrase ("Owner ruling: accepted") takes the work
# as it stands and sends nothing back.
# A signal's ask counts only in a comment that contains this phrase: a
# worker's hand-back. Set it to "" to count an ask in any comment.
handback: "Hand-back"

signals:
  - name: decision
    ask: "Decisions needed:"
    clear: ["none"]
    answered_by: "Owner ruling"
    sends_back: true
    accept: ["accepted"]
  - name: eyes
    ask: "Needs eyes:"
    clear: ["nothing", "none"]
    answered_by: "Eyes checked"
    # What a worker writes when it looked on staging and the work did not
    # pass. It closes the signal; the worker asks for a decision with it.
    failed_by: "Eyes failed"
    # What a worker writes when it could not look at all (signed out,
    # staging down), and what you write when a worker can try again. A
    # blocked look is not handed out until then. These are the defaults.
    blocked_by: "Eyes blocked"
    unblocked_by: "Eyes unblocked"
  - name: review
    ask: "**PR:**"
    follows_pr: true
